<style>
/* Plein écran : un canevas 640x480 agrandi au pixel près, façon jeu des années 90 */

#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;cursor:pointer;touch-action:none}
#load[hidden]{display:none}

<body>
<div id="load">Génération du monde…</div>
<canvas id="c" width="640" height="480" aria-label="Carte d'aventure"></canvas>
<script>
"use strict";
/* ================= Constantes ================= */
const W=640,H=480,TS=32,N=36,VX=16,VY=16,VW=14,VH=13,VPW=VW*TS,VPH=VH*TS;
const WATER=0,SAND=1,GRASS=2,DIRT=3;
const FONT='"Alegreya Sans SC", Georgia, serif';
const cv=document.getElementById('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;

/* ================= Aléatoire & bruit ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul((s|0)+1,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o=4){let t=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){t+=vnoise(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2}return t/n}
function rgb(h){const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]}

/* ================= Primitives de dessin ================= */
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.5,r),0,7);c.fill()}
function ell(c,x,y,rx,ry,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,Math.max(.5,rx),Math.max(.5,ry),0,0,7);c.fill()}
function poly(c,p,col){c.fillStyle=col;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill()}
function revPts(p){const o=[];for(let i=p.length-2;i>=0;i-=2)o.push(p[i],p[i+1]);return o}
function jag(r,x0,y0,x1,y1,n,a){const p=[];for(let i=0;i<=n;i++){const t=i/n,m=i&&i<n;p.push(x0+(x1-x0)*t+(m?(r()-.5)*a:0),y0+(y1-y0)*t+(m?(r()-.5)*a*.6:0))}return p}

/* Sprite : dessin vectoriel puis « pixelisation » : seuil alpha, grain, contour sombre */
function mk(w,h,fn,o={}){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);post(c,o);return c}
function post(c,o){const noise=o.noise||0,seed=o.seed||7,ol=o.outline===undefined?'#140c06':o.outline;
 const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),d=id.data,A=new Uint8Array(w*h);
 for(let i=0;i<w*h;i++){if(d[i*4+3]>110){d[i*4+3]=255;A[i]=1}else d[i*4+3]=0}
 if(noise)for(let i=0;i<w*h;i++)if(A[i]){const f=1+(hash(i%w,i/w|0,seed)-.5)*noise;d[i*4]*=f;d[i*4+1]*=f;d[i*4+2]*=f}
 if(ol){const[r,gg,b]=rgb(ol);for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=y*w+X;if(A[i])continue;
  if((X>0&&A[i-1])||(X<w-1&&A[i+1])||(y>0&&A[i-w])||(y<h-1&&A[i+w])){d[i*4]=r;d[i*4+1]=gg;d[i*4+2]=b;d[i*4+3]=255}}}
 x.putImageData(id,0,0)}
function flip(s){const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const x=c.getContext('2d');x.translate(s.width,0);x.scale(-1,1);x.drawImage(s,0,0);return c}

/* ================= Sprites ================= */
const STONE=['#45433e','#67645c','#8d8a7f','#b4b0a2'];
const RED=['#7a1410','#b42818','#e4543a'];
function treeSpr(pal,seed){const r=mulberry32(seed);return mk(34,42,c=>{
 rect(c,15,26,5,14,'#5c3618');rect(c,18,26,2,14,'#3a200c');rect(c,13,38,9,2,'#4a2a12');
 const b=[],n=5+(r()*3|0);for(let i=0;i<n;i++)b.push([17+(r()-.5)*12,16+(r()-.5)*10,5.5+r()*4]);
 b.forEach(([x,y,q])=>circ(c,x,y,q,pal[0]));
 b.forEach(([x,y,q])=>circ(c,x-1,y-1.5,q-1.7,pal[1]));
 b.forEach(([x,y,q])=>circ(c,x-2.2,y-3,q*.5,pal[2]));
 b.forEach(([x,y,q])=>circ(c,x-3,y-4,q*.22,pal[3]));
},{noise:.45,seed})}
function pineSpr(pal,seed){const r=mulberry32(seed);return mk(28,44,c=>{
 rect(c,12,34,4,9,'#4a2a12');rect(c,14,34,2,9,'#2e1808');
 for(let i=0;i<4;i++){const y=2+i*8,w=4+i*2.8+r()*1.2,m=14;
  poly(c,[m,y,m-w,y+11,m+w,y+11],pal[0]);poly(c,[m,y+1,m-w+1,y+10,m+1,y+10],pal[1]);poly(c,[m-1,y+3,m-w+2.5,y+9.5,m-w*.35,y+9.5],pal[2])}
},{noise:.35,seed})}
function mountSpr(seed,pal){const r=mulberry32(seed);return mk(72,58,(c,w,h)=>{
 const base=h-2,pk=[],n=2+(r()*2|0);
 for(let i=0;i<n;i++)pk.push({x:20+r()*32,y:4+r()*20,l:15+r()*10,rr:14+r()*10});
 pk.sort((a,b)=>a.y-b.y);
 pk.forEach(p=>{const lx=Math.max(1,p.x-p.l),rx=Math.min(w-1,p.x+p.rr),mx=p.x+(r()-.5)*6;
  const ridge=jag(r,p.x,p.y,mx,base,6,4),le=jag(r,p.x,p.y,lx,base,6,5),re=jag(r,p.x,p.y,rx,base,6,5);
  poly(c,[...le,...revPts(ridge)],pal[2]);poly(c,[...re,...revPts(ridge)],pal[0]);
  const mid=jag(r,p.x,p.y+2,(p.x+mx)/2-3,base,5,3);poly(c,[...mid,...revPts(ridge)],pal[1]);
  c.strokeStyle=pal[3];c.lineWidth=1.5;c.beginPath();c.moveTo(le[0],le[1]+1);for(let i=2;i<8;i+=2)c.lineTo(le[i]+1.5,le[i+1]+1);c.stroke();
  c.lineWidth=1;for(let k=0;k<5;k++){const t=.25+r()*.65,x=p.x+(lx-p.x)*t*(.3+r()*.6),y=p.y+(base-p.y)*t;c.strokeStyle=pal[0];c.beginPath();c.moveTo(x,y);c.lineTo(x+2+r()*3,y+3+r()*4);c.stroke()}
  if(p.y<11)poly(c,[p.x,p.y,p.x-4,p.y+6,p.x-1.5,p.y+4.5,p.x+.5,p.y+6.5,p.x+3,p.y+4],'#eeeae0');
 });
},{noise:.32,seed})}
function stoneWall(c,x,y,w,h){rect(c,x,y,w,h,STONE[2]);rect(c,x,y,w,1,STONE[3]);rect(c,x,y+h-2,w,2,STONE[1]);
 c.fillStyle='rgba(30,28,24,.45)';for(let yy=y+3;yy<y+h-2;yy+=4){c.fillRect(x,yy,w,1);for(let xx=x+((yy>>2)%2)*3;xx<x+w;xx+=6)c.fillRect(xx,yy-3,1,3)}}
function merlons(c,x,y,w){for(let i=x;i<x+w-1;i+=4){rect(c,i,y-4,3,4,STONE[2]);rect(c,i,y-4,3,1,STONE[3]);rect(c,i+2,y-4,1,4,STONE[1])}}
function towerB(c,x,y,w,h){for(let i=0;i<w;i++){const t=i/w;rect(c,x+i,y,1,h,t<.22?STONE[3]:t<.6?STONE[2]:t<.85?STONE[1]:STONE[0])}
 c.fillStyle='rgba(30,28,24,.4)';for(let yy=y+3;yy<y+h;yy+=4)c.fillRect(x,yy,w,1);
 const m=x+(w>>1)-1;rect(c,m,y+6,2,4,'#1a1410');if(h>30)rect(c,m,y+20,2,4,'#1a1410')}
function roof(c,cx,y,w,hh,R,fl){poly(c,[cx,y-hh,cx-w/2-2,y,cx+w/2+2,y],R[1]);poly(c,[cx,y-hh,cx+1,y,cx+w/2+2,y],R[0]);poly(c,[cx,y-hh,cx-w/2-2,y,cx-w/4,y],R[2]);
 rect(c,cx-w/2-2,y,w+4,1,'#3a0a06');fl&&fl.push([cx|0,(y-hh)|0])}
function castleSpr(R,fl){return mk(112,112,c=>{
 towerB(c,20,44,14,30);roof(c,27,44,14,16,R,fl);
 towerB(c,78,44,14,30);roof(c,85,44,14,16,R,fl);
 stoneWall(c,38,40,36,40);merlons(c,38,40,36);
 towerB(c,49,22,14,22);roof(c,56,22,14,20,R,fl);
 rect(c,44,50,3,6,'#1a1410');rect(c,65,50,3,6,'#1a1410');rect(c,55,50,3,7,'#1a1410');
 stoneWall(c,10,70,92,40);merlons(c,10,70,92);
 towerB(c,0,64,18,46);roof(c,9,64,18,18,R,fl);
 towerB(c,94,64,18,46);roof(c,103,64,18,18,R,fl);
 rect(c,45,88,22,22,'#2a1a0c');circ(c,56,89,11,'#2a1a0c');
 rect(c,47,90,18,20,'#6a4220');circ(c,56,91,9,'#6a4220');
 c.fillStyle='#4a2c12';for(let i=50;i<64;i+=3)c.fillRect(i,84,1,26);
 c.fillStyle='#1a1008';for(let i=48;i<65;i+=4)c.fillRect(i,83,1,14);for(let j=86;j<98;j+=4)c.fillRect(47,j,18,1);
 c.strokeStyle=STONE[3];c.lineWidth=1.5;c.beginPath();c.arc(56,89,11,Math.PI,0);c.stroke();
 rect(c,10,108,92,2,STONE[0]);
},{noise:.16,seed:5})}
function mineSpr(kind){const r=mulberry32(kind==='gold'?11:12);return mk(84,60,(c,w,h)=>{
 c.fillStyle='#6a4626';c.beginPath();c.moveTo(2,h-2);c.bezierCurveTo(8,14,28,6,44,8);c.bezierCurveTo(62,8,78,22,82,h-2);c.closePath();c.fill();
 c.save();c.clip();rect(c,48,0,40,h,'#4a2e16');ell(c,24,24,16,10,'#8a6034');ell(c,20,20,8,5,'#a8794a');
 for(let i=0;i<9;i++){const x=10+r()*64,y=16+r()*30;ell(c,x,y,3+r()*2,2+r(),'#5e5246');ell(c,x-1,y-1,2,1.2,'#8e8070')}c.restore();
 rect(c,32,30,20,28,'#0e0804');circ(c,42,31,10,'#0e0804');
 rect(c,29,27,4,31,'#7a4a20');rect(c,30,27,1,31,'#a0703a');rect(c,51,27,4,31,'#7a4a20');rect(c,27,24,30,4,'#8a5a2a');rect(c,27,24,30,1,'#b08048');
 c.fillStyle='#3a3a38';c.fillRect(36,52,1,7);c.fillRect(47,52,1,7);c.fillStyle='#6a4a26';for(let y=53;y<60;y+=2)c.fillRect(35,y,14,1);
 rect(c,8,46,15,8,'#5a5a58');rect(c,8,46,15,1,'#8a8a88');circ(c,11,55,2.2,'#222');circ(c,20,55,2.2,'#222');
 const P=kind==='gold'?['#a07810','#f0c838','#fff2b0']:['#4a4a48','#8a8a86','#c0c0ba'];
 for(let i=0;i<5;i++)ell(c,10+i*2.6,45,2,1.6,P[1]);
 for(let i=0;i<12;i++){const x=62+r()*14,y=50+r()*6-(i>6?3:0);ell(c,x,y,2.6,2,P[0]);ell(c,x-.5,y-.6,1.8,1.2,P[1]);rect(c,x-1|0,y-2|0,1,1,P[2])}
},{noise:.22,seed:kind==='gold'?11:12})}
function sawSpr(){const r=mulberry32(13);return mk(84,60,(c)=>{
 for(let row=0;row<2;row++)for(let i=0;i<3-row;i++){const x=6+i*7+row*3.5,y=54-row*6;circ(c,x,y,3.5,'#5a3416');circ(c,x,y,2.6,'#c8945a');circ(c,x,y,1.2,'#9a6a3a')}
 rect(c,22,28,40,28,'#8a5a2c');c.fillStyle='#5a3818';for(let x=22;x<62;x+=4)c.fillRect(x,28,1,28);rect(c,22,28,2,28,'#b07a42');rect(c,56,28,6,28,'#6a4220');
 poly(c,[17,30,42,9,67,30],'#6a3a1a');poly(c,[42,9,67,30,42,30],'#4a2610');poly(c,[42,9,17,30,26,30],'#8a5028');
 c.fillStyle='rgba(0,0,0,.3)';for(let y=14;y<30;y+=4)c.fillRect(17,y,50,1);
 rect(c,36,42,12,14,'#3a2010');rect(c,37,43,1,13,'#5a3418');rect(c,27,34,6,5,'#2a1808');rect(c,51,34,6,5,'#2a1808');
 circ(c,72,42,11,'#7a7a78');circ(c,72,42,8.5,'#b8b8b2');circ(c,70,40,4,'#d8d8d2');
 c.fillStyle='#5a5a58';for(let a=0;a<16;a++){const t=a/16*6.283;c.fillRect(72+Math.cos(t)*10.5-1|0,42+Math.sin(t)*10.5-1|0,2,2)}
 circ(c,72,42,2,'#2a2a28');rect(c,60,52,24,4,'#7a4a20');
},{noise:.2,seed:13})}
const RES=['wood','merc','ore','sulf','crys','gems','gold'];
function resSpr(k){const r=mulberry32(k.length*31+k.charCodeAt(0));return mk(32,24,c=>{
 if(k==='gold'){const L=[[6,19,7],[10,15,5],[13,11,3],[15,8,1]];L.forEach(([x0,y,n])=>{for(let i=0;i<n;i++){const x=x0+i*3.4+(r()-.5);ell(c,x,y,3,2,'#a07810');ell(c,x,y-.8,2.8,1.4,'#f0c838');rect(c,x-1|0,y-2|0,1,1,'#fff2b0')}})}
 else if(k==='wood'){[[8,18],[16,18],[24,18],[12,11],[20,11],[16,4]].forEach(([x,y])=>{circ(c,x,y,4,'#5a3416');circ(c,x,y,3,'#c8945a');circ(c,x,y,1.6,'#9a6a3a');rect(c,x,y,1,1,'#5a3416')})}
 else if(k==='ore'){[[8,18,5],[17,19,5],[25,18,4],[12,12,4],[21,12,4],[16,7,3.5]].forEach(([x,y,q])=>{ell(c,x,y,q,q*.8,'#4e4e4c');ell(c,x-1,y-1.2,q*.7,q*.5,'#8a8a86');rect(c,x-2|0,y-2|0,1,1,'#c8c8c0')})}
 else if(k==='sulf'){poly(c,[3,22,16,5,29,22],'#9a8410');poly(c,[3,22,16,5,15,22],'#e0cc30');poly(c,[8,22,16,9,13,22],'#f4e470');for(let i=0;i<8;i++)rect(c,6+r()*20|0,15+r()*6|0,1,1,'#fff6a0')}
 else if(k==='crys'){[[9,22,6,8],[16,22,2,10],[23,22,7,9]].forEach(([x,y,a,b])=>{poly(c,[x-4,y,x-1,y-14-b*.3,x+3,y-12,x+4,y],'#8a1424');poly(c,[x-4,y,x-1,y-14-b*.3,x,y],'#e04052');rect(c,x-2|0,y-10|0,1,4,'#ffb0b8')})}
 else if(k==='gems'){const C=[['#1a3aa0','#5a8af0'],['#0e7a30','#50d070'],['#7a1a8a','#d060e0'],['#a07a10','#f0d050']];
  [[8,18],[16,19],[24,18],[12,12],[20,12]].forEach(([x,y],i)=>{const q=C[i%4];poly(c,[x,y-5,x+4,y,x,y+4,x-4,y],q[0]);poly(c,[x,y-5,x-4,y,x,y],q[1]);rect(c,x-2,y-2,1,1,'#fff')})}
 else if(k==='merc'){circ(c,16,15,7.5,'#7090a8');circ(c,16,16.5,5.5,'#c8d4de');circ(c,14,14,2,'#ffffff');rect(c,13,3,6,7,'#7090a8');rect(c,13,1,6,3,'#8a5a2a');rect(c,14,4,1,5,'#c0d8e8')}
 else if(k==='chest'){rect(c,5,10,22,12,'#6a3e18');rect(c,5,10,22,1,'#9a6a32');rect(c,5,5,22,6,'#8e5a26');rect(c,6,5,20,1,'#b07a40');
  rect(c,10,5,2,17,'#d8b040');rect(c,20,5,2,17,'#d8b040');rect(c,14,11,4,5,'#f0d050');rect(c,15,13,2,2,'#2a1808')}
},{noise:.15,seed:k.length})}
function heroSpr(f,col){return mk(44,46,c=>{const by=28;
 c.strokeStyle='#5a3a1a';c.lineWidth=3;c.beginPath();c.moveTo(10,by-2);c.quadraticCurveTo(3,by+2,6,by+11);c.stroke();
 const L=f?[[12,2],[16,-2],[27,-2],[31,2]]:[[13,-1],[15,1],[28,1],[30,-1]];
 L.forEach(([x,o],i)=>{rect(c,x+o,by+3,3,12,i%2?'#bdb4a2':'#d8d0c0');rect(c,x+o,by+13,3,2,'#3a2a1a')});
 ell(c,21,by,12,6,'#e6dfd0');ell(c,21,by+2.5,11,3.5,'#c4baa6');
 poly(c,[28,by-3,33,by-14,37,by-12,33,by+1],'#e6dfd0');ell(c,37,by-12,5,3,'#e6dfd0');rect(c,39,by-11,3,2,'#c4baa6');rect(c,36,by-14,1,1,'#1a1008');
 c.fillStyle='#7a5a3a';for(let i=0;i<5;i++)c.fillRect(30+i,by-12+i*2,2,3);
 rect(c,12,by-6,17,9,col[1]);rect(c,12,by+2,17,2,'#d8b040');rect(c,12,by-6,17,1,col[2]);rect(c,12,by-6,2,9,col[2]);
 rect(c,20,by-7,4,9,'#8a8a92');rect(c,20,by+1,4,2,'#3a3a40');
 rect(c,18,by-18,8,12,'#9a9aa2');rect(c,18,by-18,3,12,'#cacad2');rect(c,19,by-16,6,9,col[1]);rect(c,19,by-16,2,9,col[2]);
 rect(c,19,by-25,6,7,'#b8b8c0');rect(c,19,by-25,2,7,'#e4e4ec');rect(c,21,by-22,4,1,'#1a1a20');
 ell(c,21,by-26,3.5,2,col[2]);ell(c,17,by-27,3,1.5,col[1]);
 ell(c,16,by-10,4,5,col[0]);ell(c,16,by-10.5,3,4,col[1]);rect(c,15,by-13,2,5,'#d8b040');
 rect(c,25,by-15,3,6,'#9a9aa2');
},{noise:.1,seed:21})}
function flowerSpr(seed){const r=mulberry32(seed),C=['#e8e040','#f070a0','#ffffff','#a070f0','#f09030'];return mk(16,10,c=>{

  g.drawImage(SPR.res.gold,x+224,y+164,22,16);txt((d.n*c.cost).toLocaleString('fr-FR'),x+250,y+177,{size:12,col:d.n*c.cost<=S.res.gold?'#f2e2b4':'#e88a70'});
  ibtn(x+70,y+h-34,96,24,'Recruter',()=>recruit(d.cr,d.n),{dis:d.n<=0});ibtn(x+176,y+h-34,96,24,'Annuler',()=>{sfx('click');T.dlg=null});return}
 if(d.type==='guild'){const x=W/2-200,y=50,w=400,h=230,hr=S.hero;dlgBox(x,y,w,h,'Guilde des mages · niveau 1');
  T.spells.forEach((k,i)=>{const sp=SPELLS[k],yy=y+48+i*44;inset(g,x+16,yy,w-32,38);circ(g,x+34,yy+19,9,sp.col);circ(g,x+32,yy+17,4,'#ffffff');
   txt(sp.name,x+52,yy+16,{size:12,col:'#f4dc8c'});txt('Mana '+sp.cost,x+w-24,yy+16,{size:10,align:'right',col:'#80c0ff'});txt(sp.desc,x+52,yy+31,{size:10,w:500})});
  txt(hr.spells.length?hr.name+' connaît ces sorts. Mana : '+hr.mana+' / '+hr.know*10:'Le héros apprendra ces sorts en visitant le château.',W/2,y+h-44,{align:'center',size:10,col:'#c8b080',w:500});
  ibtn(W/2-50,y+h-32,100,22,'Fermer',()=>{sfx('click');T.dlg=null});return}
 if(d.type==='market'){const x=W/2-220,y=30,w=440,h=280;dlgBox(x,y,w,h,'Marché');
  txt('Donner',x+110,y+48,{align:'center',size:11,col:'#c8b080'});txt('Recevoir',x+w-110,y+48,{align:'center',size:11,col:'#c8b080'});
  RES_ICON_ORDER.forEach((k,j)=>{[[d.give,'give',x+20],[d.get,'get',x+w-200]].forEach(([sel,key,bx])=>{const cx=bx+(j%4)*45,cy=y+56+(j>>2)*52;inset(g,cx,cy,42,48);
   if(sel===k){g.strokeStyle='#7aff7a';g.strokeRect(cx+.5,cy+.5,41,47)}g.drawImage(SPR.res[k],cx+5,cy+6,32,24);txt(key==='give'?String(S.res[k]):'',cx+21,cy+43,{align:'center',size:10});
   hit(cx,cy,42,48,()=>{d[key]=k;sfx('click')},RES_NAME[k])})});
  const r=rate(d.give,d.get);
  txt(r?r[0]+' '+RES_NAME[d.give].toLowerCase()+'  →  '+r[1]+' '+RES_NAME[d.get].toLowerCase():'Choisis deux ressources différentes.',W/2,y+188,{align:'center',size:12});
  const ok=r&&S.res[d.give]>=r[0];
  ibtn(W/2-110,y+204,100,24,'Échanger',()=>{S.res[d.give]-=r[0];S.res[d.get]+=r[1];sfx('pick')},{dis:!ok});
  ibtn(W/2+10,y+204,100,24,'Tout',()=>{const k=Math.floor(S.res[d.give]/r[0]);S.res[d.give]-=k*r[0];S.res[d.get]+=k*r[1];sfx('pick')},{dis:!ok});
  ibtn(W/2-50,y+h-32,100,22,'Fermer',()=>{sfx('click');T.dlg=null});return}
 if(d.type==='info'){const b=BLDI[d.b],x=W/2-160,y=80,w=320,h=180;dlgBox(x,y,w,h,b.name);const s=SPR.town[d.b],sc=Math.min(1,90/s.height);
  g.drawImage(s,W/2-s.width*sc/2,y+130-s.height*sc,s.width*sc,s.height*sc);txt(b.desc,W/2,y+148,{align:'center',size:11,w:500});ibtn(W/2-50,y+h-28,100,22,'Fermer',()=>{sfx('click');T.dlg=null})}}
function townMove(x,y){const T=S.town;T.mx=x;T.my=y;T.hb=T.dlg?null:townHover(x,y);const hv=UIR.slice().reverse().find(r=>x>=r.x&&y>=r.y&&x<r.x+r.w&&y<r.y+r.h);if(hv!==T.hv){T.hv=hv;T.hvT=now()}}
function townDown(x,y){const T=S.town;const r=UIR.slice().reverse().find(r=>x>=r.x&&y>=r.y&&x<r.x+r.w&&y<r.y+r.h);if(r){r.fn();return}if(!T.dlg&&T.hb)clickBuilding(T.hb)}

/* ================= Sorts au combat ================= */
function spd(u){let s=u.d.spd+(u.fx.hate?3:0);if(u.fx.lenteur)s=Math.ceil(s/2);return s}
function openBook(){const h=S.hero;if(!h.spells.length){C.log='Aucun sort connu : construis une guilde des mages et visite le château.';return}
 if(C.castRound===C.round){C.log='Un seul sort par round.';return}
 if(C.deploy||C.busy||!C.active||C.active.side){C.log='Attends le tour d\'une de tes unités.';return}C.book=true}
function spellOk(sp,u){return u&&!u.dead&&((SPELLS[sp].tgt==='foe')===(u.side===1))}
function sparkle(u,col){for(let i=0;i<26;i++){const a=Math.random()*6.28,r=Math.random()*18;C.parts.push({x:u.rx+Math.cos(a)*r,y:u.ry-20+Math.sin(a)*r*1.3,vy:-(.3+Math.random()*.8),t0:now()+Math.random()*250,col})}}
async function castSpell(sp,u){const h=S.hero,s=SPELLS[sp];h.mana-=s.cost;C.castRound=C.round;C.casting=null;C.busy=true;C.reach=null;sfx('magic');
 if(sp==='fleche'){const[x0,y0]=[36,124],[x1,y1]=[u.rx,u.ry-22],pr={x:x0,y:y0,a:0,k:'orb',spin:0};C.proj.push(pr);
  await tween(380,p=>{pr.x=x0+(x1-x0)*p;pr.y=y0+(y1-y0)*p-Math.sin(p*Math.PI)*30;pr.spin=p});C.proj=C.proj.filter(q=>q!==pr);
  const dmg=10+10*h.pow,k=applyDmg(u,dmg);sparkle(u,s.col);sfx('hit');u.flash=1;floatTxt(u,'-'+dmg,'#e0b0ff');C.log=h.name+' lance Flèche magique : '+dmg+' dégâts'+(k?', '+k+' '+nm(u,k).toLowerCase()+' '+(k>1?'périssent':'périt'):'')+'.';
  if(u.dead)await die(u)}
 else{sparkle(u,s.col);await wait(550);
  if(sp==='soin'){const v=15+5*h.pow,before=u.hp;u.hp=Math.min(u.d.hp,u.hp+v);floatTxt(u,'+'+(u.hp-before),'#90ff90');C.log=h.name+' lance Soin sur '+n0(u)+'.'}
  else{u.fx[sp]=1;C.log=h.name+' lance '+s.name+' sur '+n0(u)+'.'}}
 C.busy=false;if(checkEnd())return;C.reach=reachOf(C.active);updatePlan()}

/* ================= Entrées ================= */
const UI={hoverBtn:null,downBtn:null,slot:-1,sel:null,slotT:0,portT:0,tileT:0,lastTile:-1};
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function inMap(x,y){return x>=VX&&y>=VY&&x<VX+VPW&&y<VY+VPH}
function tileAt(x,y){const tx=(x-VX+S.cam.x)/TS|0,ty=(y-VY+S.cam.y)/TS|0;return inb(tx,ty)?idx(tx,ty):-1}
function btnAt(x,y){return BTN.find(b=>x>=b.x&&y>=b.y&&x<b.x+b.w&&y<b.y+b.h)}
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(S.townView){townMove(x,y);return}if(S.combat){combatMove(x,y);return}{const sl=(y>=321&&y<351&&x>=491&&x<631)?((x-491)/28|0):-1;if(sl!==UI.slot){UI.slot=sl;UI.slotT=now()}const pt=x>=488&&x<536&&y>=160&&y<208;if(pt!==UI.portrait){UI.portrait=pt;UI.portT=now()}const tl=inMap(x,y)?tileAt(x,y):-1;if(tl!==UI.lastTile){UI.lastTile=tl;UI.tileT=now()}}UI.mx=x;UI.my=y;UI.inMap=inMap(x,y);if(!UI.inMap)cv.style.cursor='default';const b=btnAt(x,y);UI.hoverBtn=b?b.id:null;S.hover=inMap(x,y)?tileAt(x,y):-1;
 if(UI.dragMini)miniJump(x,y)});
cv.addEventListener('pointerleave',()=>{UI.inMap=false;UI.hoverBtn=null;S.hover=-1;UI.dragMini=false});
cv.addEventListener('pointerdown',e=>{audio();if(SND.ctx&&SND.ctx.state==='suspended')SND.ctx.resume();const[x,y]=pos(e);if(S.townView){townDown(x,y);return}if(S.combat){combatDown(x,y);return}const b=btnAt(x,y);
 if(b){UI.downBtn=b.id;return}
 if(UI.slot>=0){slotClick(UI.slot);return}
 if(x>=MM.x&&y>=MM.y&&x<MM.x+144&&y<MM.y+144){UI.dragMini=true;miniJump(x,y);return}
 if(inMap(x,y)){const i=tileAt(x,y);if(i>=0)clickTile(i)}});
window.addEventListener('pointerup',e=>{UI.dragMini=false;if(S.townView||S.combat||!UI.downBtn)return;const[x,y]=pos(e),b=btnAt(x,y),id=UI.downBtn;UI.downBtn=null;if(b&&b.id===id)button(id)});
function slotClick(j){const A=S.hero.army;sfx('click');
 if(UI.sel===null||UI.sel===undefined){if(A[j]){UI.sel=j;say('Clique un autre emplacement pour échanger ou regrouper.')}return}
 const i=UI.sel;UI.sel=null;if(i===j){say('');return}
 if(A[j]&&A[i]&&A[j].t===A[i].t){A[j].n+=A[i].n;A[i]=null;say('Troupes regroupées.')}else{[A[i],A[j]]=[A[j],A[i]];say('Emplacements échangés. L\'ordre détermine la position au combat.')}}
function miniJump(x,y){S.follow=false;S.cam.x=(x-MM.x)/4*TS-VPW/2;S.cam.y=(y-MM.y)/4*TS-VPH/2;clampCam()}
function button(id){sfx('click');const h=S.hero;
 if(id==='hero'){S.follow=true;centerCam(h.x,h.y,true);say(h.name+' : '+h.mp+' points de mouvement restants.')}
 else if(id==='move'){if(h.path)startMove();else say('Aucun chemin en attente.')}
 else if(id==='kingdom'){openTown(h.x===S.castle.tx&&h.y===S.castle.ty)}
 else if(id==='spells')say(h.spells.length?'Sorts connus : '+h.spells.map(k=>SPELLS[k].name+' ('+SPELLS[k].cost+')').join(', ')+'. Mana '+h.mana+'/'+h.know*10+'.':'Aucun sort : construis une guilde des mages au château, puis visite-le avec le héros.');
 else if(id==='end')endTurn();
 else if(id==='quest')say('Objectif : vaincre les héros adverses. Explore, prends les mines et affronte les créatures qui les gardent.');
 else if(id==='newmap'){document.getElementById('load').hidden=false;setTimeout(()=>{generate(Math.random()*1e9|0);document.getElementById('load').hidden=true},30)}
 else if(id==='sound'){SND.on=!SND.on;say(SND.on?'Son activé.':'Son coupé.')}}
const keys={};
window.addEventListener('keydown',e=>{keys[e.key]=true;if(S.townView){if(e.key==='Escape'){if(S.town.dlg)S.town.dlg=null;else closeTown()}return}if(S.combat&&e.key==='Escape'){C.book=false;C.casting=null;return}if(S.combat){if(e.key===' '){e.preventDefault();combatButton('defend')}if(e.key==='a'||e.key==='A')combatButton('auto');return}if(e.key==='Enter')button('end');if(e.key===' '){e.preventDefault();button('move')}});
window.addEventListener('keyup',e=>{keys[e.key]=false});

/* ================= Boucle ================= */
function fit(){const s=Math.min((innerWidth-32)/W,(innerHeight-16)/H),k=s>=2?Math.floor(s):s>=1?Math.floor(s*2)/2:s;cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px'}
addEventListener('resize',fit);
let last=0;
function loop(t){const dt=Math.min(50,t-last);last=t;if(S.townView){renderTown(t);requestAnimationFrame(loop);return}if(S.combat){updateCombat();if(S.combat){renderCombat(t);requestAnimationFrame(loop);return}}
 const k=6*dt/16;let mv=false;if(keys.ArrowLeft){S.cam.x-=k;mv=true}if(keys.ArrowRight){S.cam.x+=k;mv=true}if(keys.ArrowUp){S.cam.y-=k;mv=true}if(keys.ArrowDown){S.cam.y+=k;mv=true}
 if(mv){S.follow=false;clampCam()}
 updateMove(dt);if(S.follow&&S.hero.moving)centerCam(S.hero.fx,S.hero.fy,false);
 render(t);requestAnimationFrame(loop)}
async function boot(){try{await Promise.race([document.fonts.load('700 12px "Alegreya Sans SC"'),new Promise(r=>setTimeout(r,1500))])}catch(e){}
 initSprites();buildChrome();initCombatSprites();initTownSprites();generate(20261001);fit();document.getElementById('load').hidden=true;requestAnimationFrame(loop)}
setTimeout(boot,20);
</script>
</body>
